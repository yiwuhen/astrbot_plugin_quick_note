name: astrbot_plugin_quick_note
display_name: 随手记
short_desc: 随口一句自动记住，按优先级整理成清单，也能排成周视图
desc: |
  随手记 / 备忘 / 待办插件：随口说一句，机器人自动记下并整理。

  - 极低摩擦：「记 明天下午3点交报告」「记 周五买牛奶 不急」，时间与优先级自动识别
  - 智能解析：今天/明天/下周三/11月15号/3天后/晚上8点半/10:30 等中文时间写法都认得
  - 自动整理：「清单」按 已过期 → 紧急 → 有时间 → 随手记 分组排列，过期自动置顶
  - 周视图：「清单 本周」按周一到周日排出本周安排，今天高亮；「下周」看下一周
  - AI 直接调用：注册为 AI 工具（Function Calling），直接说「别忘了周五交周报」「这周有什么安排」即可，不必记命令
  - WebUI 数据面板：插件详情页打开可视化面板，查看/编辑所有会话的记录、按周查看、直接改配置
  - 图片卡片：「清单 图」「本周 图」把清单/周安排渲染成好看的图片发出来，AI 场景说「发张图看看」即可
  - 自动捕捉：群里说「记住…」「别忘了…」自动收进清单
  - 多群隔离：每个会话独立清单；数据落 data/plugin_data/，重装不丢

  命令：记 / 清单 / 本周 / 随手记帮助。
version: v0.3.1
author: WuHen
repo: https://github.com/yiwuhen/astrbot_plugin_quick_note
category: 工具
tags:
  - 随手记

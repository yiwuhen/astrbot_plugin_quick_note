  - 清单
  - 日程
  - AI工具
  - 可视化
  - 图片卡片
short_desc: 随口一句自动记住，按优先级整理成清单，也能排成周视图
help: |
  随口一句就记上：「记 明天下午3点交报告」「记 周五买牛奶 不急」。

  看整理结果：「清单」按优先级排列；「清单 本周」排成周一到周日的周视图。
  打勾：「清单 完成 3」；删除：「清单 删 3」。

  接了 AI 后直接说「别忘了周五交周报」「我最近都有啥事」「这周有什么安排」。
support_platforms:
  - aiocqhttp
  - qq_official
astrbot_version: ">=4.5.0"
